name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: linsemail
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linsemail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linsemail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LINSEMAIL_DATABASE_URL: postgresql+psycopg://linsemail:ci-only-password@127.0.0.1:5432/linsemail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: node scripts/test-i18n.cjs
      - run: npm run build --prefix frontend
      - run: python -m pytest backend/tests tests -q
      - run: python scripts/package-release.py
      - run: python scripts/check-release.py
